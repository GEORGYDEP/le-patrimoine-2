<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le patrimoine de l'entreprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--bg2:#121a2e;--bg3:#0d1428;--card:#151f38;--card2:#1b2747;
  --accent:#22d68a;--orange:#ff8a3d;--gold:#fbbf24;
  --text:#e8ecf4;--text2:#a3afc6;--text3:#6c7a97;--border:#26324f;
  --radius:16px;--success:#22d68a;--error:#ff4060;
  --actif:#3b82f6;--actif2:#93c5fd;--cp:#22c55e;--cp2:#86efac;--dette:#f43f5e;--dette2:#fda4af;
  --violet:#a78bfa;--teal:#2dd4bf;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;font-size:16px;
  background-image:radial-gradient(circle at 12% -5%,rgba(34,214,138,.10),transparent 40%),radial-gradient(circle at 95% 5%,rgba(59,130,246,.12),transparent 45%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}
.mono{font-family:'Space Mono',monospace}
.muted{color:var(--text3)}

/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(11,16,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hud-l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-size:1.6rem}
.app-title{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.gold{color:var(--gold)}
.btn-ico{background:var(--card)}
.btn-ico:hover{border-color:var(--accent)}
#hudStreak.hot{color:var(--orange);border-color:var(--orange);animation:pulse 1s ease-in-out infinite}
#xpwrap{position:sticky;top:57px;z-index:40;padding:8px 16px 10px;background:rgba(11,16,32,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.xp-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text2);margin-bottom:5px;gap:8px}
#rankName{font-weight:700;color:var(--text)}
.xpbar{position:relative;height:10px;background:#1a2440;border-radius:999px;overflow:visible}
#xpfill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s ease}
.xpmark{position:absolute;top:-3px;width:3px;height:16px;background:#3a4a70;border-radius:2px}
.xpmark.got{background:var(--gold)}
#navdots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.ndot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;background:var(--card);border:2px solid var(--border)}
.ndot.done{background:var(--accent);color:#0b1020;border-color:var(--accent)}
.ndot.cur{border-color:var(--gold);color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.ndot.locked{opacity:.4;cursor:not-allowed}

/* ---------- Layout ---------- */
main{max-width:920px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:2rem;line-height:1.15;font-weight:800}
h2{font-size:1.4rem;font-weight:800;margin-bottom:10px}
h3{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;border:none;background:var(--accent);color:#0b1020;font-weight:800;font-size:1rem;transition:transform .15s,opacity .15s,box-shadow .15s;box-shadow:0 6px 18px rgba(34,214,138,.25)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.orange{background:var(--orange);box-shadow:0 6px 18px rgba(255,138,61,.25)}
.btn.gold{background:var(--gold);box-shadow:0 6px 18px rgba(251,191,36,.25)}
.link{background:none;border:none;color:var(--text2);font-size:.9rem;padding:4px 0}
.link:hover{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.lbbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.lbbtn{padding:10px 20px;border-radius:10px;font-weight:700;background:transparent}
.lbbtn.app{border:1px solid var(--accent);color:var(--accent)}
.lbbtn.app:hover{background:var(--accent);color:#0b1020}
.lbbtn.glob{border:1px solid var(--orange);color:var(--orange)}
.lbbtn.glob:hover{background:var(--orange);color:#0b1020}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center}
.hero-art{background:linear-gradient(160deg,#16244a,#0f1830);border:1px solid var(--border);border-radius:20px;padding:10px}
.hero-art svg{width:100%;height:auto;display:block}
.tag{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:rgba(34,214,138,.1);border:1px solid rgba(34,214,138,.3);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.lead{color:var(--text2);font-size:1.08rem;margin:10px 0 16px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--gold)}
.stat span{font-size:.78rem;color:var(--text2)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.step3{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px}
.step3 .ic{font-size:1.6rem}
.who{margin-top:14px;font-size:.88rem;color:var(--text2)}

/* ---------- Parcours ---------- */
.path{position:relative;margin:26px 0 10px;padding:10px 0}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed #2c3a5e;transform:translateX(-50%)}
.pnode{position:relative;display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;margin-bottom:22px}
.pcirc{grid-column:2;justify-self:center;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;background:var(--card);border:3px solid var(--border);z-index:2}
.pnode.done .pcirc{background:var(--accent);border-color:var(--accent);color:#0b1020}
.pnode.cur .pcirc{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 6px rgba(251,191,36,.15);animation:pulse 1.8s ease-in-out infinite}
.pnode.locked .pcirc{opacity:.5}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:left;width:100%;transition:transform .15s,border-color .15s}
.pcard:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent)}
.pnode.locked .pcard{opacity:.5}
.pnode:nth-child(odd) .pcard{grid-column:1;grid-row:1}
.pnode:nth-child(even) .pcard{grid-column:3;grid-row:1}
.pcard .pic{font-size:1.8rem}
.pcard .pnum{font-size:.75rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.pcard .ptit{font-weight:800;font-size:1.05rem;margin:2px 0}
.pcard .pdesc{font-size:.86rem;color:var(--text2)}
.pcard .pmeta{margin-top:8px;font-size:.85rem;color:var(--gold);font-weight:700}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.trophy{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.trophy .ti{font-size:1.9rem}
.trophy .tn{font-weight:700;font-size:.9rem}
.trophy .tc{font-size:.75rem;color:var(--text2)}
.trophy.off{opacity:.45;filter:grayscale(1)}
.trophy.on{border-color:var(--gold);box-shadow:0 0 18px rgba(251,191,36,.18)}

/* ---------- Briefing ---------- */
.bhead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.bhead .bic{font-size:2.6rem;width:66px;height:66px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border);border-radius:18px;flex-shrink:0}
.bhead .bsub{color:var(--text2);font-size:.9rem}
.box{border-radius:14px;padding:14px 16px;margin:14px 0;border:1px solid var(--border);background:var(--bg2)}
.box h3{font-size:1rem}
.box ul{padding-left:20px}
.box li{margin:4px 0}
.box.obj{border-color:rgba(34,214,138,.4);background:rgba(34,214,138,.06)}
.box.ex{border-color:rgba(255,138,61,.45);background:rgba(255,138,61,.07)}
.box.kw{border-color:rgba(147,197,253,.35);background:rgba(59,130,246,.06)}
.box.kw p{margin:4px 0;font-size:.95rem}
details.plus{border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.06);border-radius:14px;padding:12px 16px;margin:14px 0}
details.plus summary{cursor:pointer;font-weight:700;color:var(--gold)}
details.plus .pc{margin-top:8px;font-size:.95rem}
.bnb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:.85rem}
.bnb div{border-radius:10px;padding:8px 10px}
.bnb .a{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4)}
.bnb .p{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.4)}
.bnb .d{background:rgba(244,63,94,.10);border:1px solid rgba(244,63,94,.4)}
.pred{margin:18px 0 6px;text-align:center}
.pred-t{font-weight:700;margin-bottom:10px}
.pred-b{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pbtn{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);font-weight:600}
.pbtn:hover{border-color:var(--violet)}
.pbtn.on{border-color:var(--violet);background:rgba(167,139,250,.15);color:#ddd6fe}
.brief-act{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ---------- Lecteur vidéo ---------- */
.vp{background:#0b1120;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:14px 0}
.vp-stage{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 50% 30%,#18264a,#0f1524 70%)}
.vp-stage svg{width:100%;height:100%;display:block}
.vp-poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:16px;background:radial-gradient(circle at 50% 40%,rgba(34,214,138,.12),transparent 60%)}
.vp-big{width:74px;height:74px;border-radius:50%;background:var(--accent);color:#0b1020;font-size:2rem;display:flex;align-items:center;justify-content:center;padding-left:6px;box-shadow:0 0 0 10px rgba(34,214,138,.15);animation:pulse 1.8s ease-in-out infinite}
.vp-pt{font-weight:800;font-size:1.15rem;margin-top:8px}
.vp-pd{color:var(--text2);font-size:.88rem}
.vp-cap{min-height:3.4em;padding:10px 14px;font-size:1rem;border-top:1px solid var(--border);background:#0e1528}
.vp-ctrl{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--border)}
.vbtn{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:.9rem;min-width:38px}
.vbtn:hover{border-color:var(--accent)}
.vbtn.on{border-color:var(--accent);color:var(--accent)}
.vp-prog{flex:1;height:6px;background:#1c2640;border-radius:3px;overflow:hidden}
#vpBar{height:100%;width:0;background:var(--accent);transition:width .1s linear}
.vp-scn{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--text2)}
/* animations des scènes */
.vstage .a-fade{animation:vFade .7s ease var(--d,0s) both}
.vstage .a-pop{transform-box:fill-box;transform-origin:center;animation:vPop .6s cubic-bezier(.34,1.56,.64,1) var(--d,0s) both}
.vstage .a-up{animation:vUp .6s ease-out var(--d,0s) both}
.vstage .a-left{animation:vLeft .7s ease-out var(--d,0s) both}
.vstage .a-right{animation:vRight .7s ease-out var(--d,0s) both}
.vstage .a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:vDraw 1s ease var(--d,0s) forwards}
.vstage .a-pulse{transform-box:fill-box;transform-origin:center;animation:vPulse 1.6s ease-in-out var(--d,0s) infinite}
.vstage .a-float{animation:vFloat 3s ease-in-out var(--d,0s) infinite}
.vstage .a-spin{transform-box:fill-box;transform-origin:center;animation:vSpin 8s linear var(--d,0s) infinite}
.vstage .a-flash{pointer-events:none;animation:vFlash .9s ease-out var(--d,0s) both}
.vstage.paused,.vstage.paused *{animation-play-state:paused!important}
@keyframes vFade{from{opacity:0}to{opacity:1}}
@keyframes vPop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
@keyframes vUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes vLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes vRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes vDraw{to{stroke-dashoffset:0}}
@keyframes vPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes vSpin{to{transform:rotate(360deg)}}
@keyframes vFlash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}

/* ---------- Bac à sable ---------- */
.sandbox{border:1px solid rgba(45,212,191,.45);background:rgba(45,212,191,.06);border-radius:14px;padding:14px 16px;margin:14px 0}
.sandbox h3{color:var(--teal)}
.sb-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;align-items:center}
.sb-ctrl label{display:block;font-size:.92rem;margin:8px 0}
.sb-ctrl b{color:var(--gold);font-family:'Space Mono',monospace}
.sb-ctrl input[type=range]{width:100%;accent-color:var(--teal);margin-top:4px}
#sbViz svg{width:100%;height:auto;display:block}
#sbTxt{margin-top:8px;font-size:.92rem;text-align:center}

/* ---------- Questions ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.qcount{font-size:.85rem;color:var(--text2);font-weight:600}
.qdots{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.qdot{width:14px;height:14px;border-radius:50%;background:#26324f}
.qdot.correct{background:var(--success)}
.qdot.hint{background:var(--orange)}
.qdot.shown{background:var(--error)}
.qdot.now{background:var(--gold);box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.qlabel{display:inline-block;font-size:.78rem;font-weight:700;color:var(--violet);background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:999px;padding:3px 10px;margin-bottom:12px}
.qtext{font-size:1.12rem;font-weight:600;margin-bottom:12px}
.data{display:block;background:#0e1730;border:1px dashed #3b4d78;border-radius:12px;padding:12px 14px;margin:8px 0 14px;font-size:.98rem;line-height:1.7}
.data b{color:var(--gold);font-family:'Space Mono',monospace;font-weight:700;white-space:nowrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);font-size:1rem;transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt-l{width:30px;height:30px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:.9rem}
.opt.wrong{border-color:var(--error);background:rgba(255,64,96,.08);opacity:.75}
.opt.right{border-color:var(--success);background:rgba(34,214,138,.12)}
.opt.reveal{border:2px dashed var(--success);background:rgba(34,214,138,.06)}
.vf-st{font-size:1.1rem;font-style:italic;background:var(--bg2);border-left:4px solid var(--violet);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vfbtn{padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);font-size:1.1rem;font-weight:700}
.vfbtn:hover:not(:disabled){border-color:var(--accent)}
.vfbtn.right{border-color:var(--success);background:rgba(34,214,138,.12)}
.vfbtn.wrong{border-color:var(--error);background:rgba(255,64,96,.1)}
.multi{display:grid;gap:9px}
.mitem{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);font-size:.98rem}
.mitem .box{width:24px;height:24px;margin:0;padding:0;border-radius:7px;border:2px solid #44547d;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;background:transparent;color:#0b1020}
.mitem.on{border-color:var(--actif2)}
.mitem.on .box{background:var(--actif2);border-color:var(--actif2)}
.mitem.right{border-color:var(--success);background:rgba(34,214,138,.1)}
.mitem.right .box{background:var(--success);border-color:var(--success)}
.mitem.wrong{border-color:var(--error);background:rgba(255,64,96,.08)}
.mitem.wrong .box{background:var(--error);border-color:var(--error)}
.mitem.missed{border:2px dashed var(--success)}
.inp{display:flex;align-items:center;gap:8px;max-width:380px}
.inp input{flex:1;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:#0e1730;color:var(--text);font-size:1.15rem;font-family:'Space Mono',monospace;outline:none}
.inp input:focus{border-color:var(--accent)}
.unit{font-weight:700;color:var(--text2);font-size:1.1rem}
.calc{min-height:1.6em;margin-top:6px;font-family:'Space Mono',monospace;font-size:.9rem;color:var(--teal)}
.reserve{background:#0e1730;border:1px dashed #3b4d78;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.rs-t{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:10px;border:1px solid #3b4d78;background:var(--card2);font-size:.92rem;text-align:left;transition:transform .12s,border-color .12s}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.sel{border-color:var(--gold);background:rgba(251,191,36,.15);transform:translateY(-2px);box-shadow:0 4px 12px rgba(251,191,36,.2)}
.chip.bounce{animation:bounce .5s ease}
.lock-g{border-color:var(--success)!important;background:rgba(34,214,138,.12)!important}
.lock-o{border-color:var(--orange)!important;background:rgba(255,138,61,.12)!important}
.lock-r{border-color:var(--error)!important;background:rgba(255,64,96,.1)!important}
.fix{display:block;font-size:.82rem;font-weight:700;color:#ffd0d8;margin-top:3px}
.lock-g .fix,.lock-o .fix{color:#c9f7e2}
.zones{display:grid;gap:10px}
.zones.z3{grid-template-columns:repeat(3,1fr)}
.zones.z2{grid-template-columns:repeat(2,1fr)}
.zone{min-height:120px;border-radius:14px;border:2px dashed #3b4d78;padding:10px;background:rgba(255,255,255,.02);cursor:pointer;transition:border-color .15s,background .15s}
.zone:hover{background:rgba(255,255,255,.05)}
.zone-t{font-weight:800;font-size:.92rem;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.zc-actif{border-color:rgba(59,130,246,.6)}.zc-actif .zone-t{color:var(--actif2)}
.zc-cp{border-color:rgba(34,197,94,.6)}.zc-cp .zone-t{color:var(--cp2)}
.zc-dette{border-color:rgba(244,63,94,.6)}.zc-dette .zone-t{color:var(--dette2)}
.zc-n1{border-color:rgba(167,139,250,.6)}.zc-n1 .zone-t{color:#ddd6fe}
.zc-n2{border-color:rgba(45,212,191,.6)}.zc-n2 .zone-t{color:#99f6e4}
.zc-n3{border-color:rgba(59,130,246,.6)}.zc-n3 .zone-t{color:var(--actif2)}
.zone.ready{background:rgba(251,191,36,.06);border-style:solid}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg2)}
.mterm{font-weight:600}
.mrow select{width:100%;padding:10px;border-radius:10px;border:1px solid #3b4d78;background:#0e1730;color:var(--text);font-family:inherit;font-size:.95rem}
.mrow .fix{grid-column:1/-1}
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:2px dashed #3b4d78;background:rgba(255,255,255,.02);cursor:pointer;min-height:52px;flex-wrap:wrap}
.slot.filled{border-style:solid;background:var(--card2)}
.slot.ready{border-color:var(--gold)}
.slot .num{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#0b1020;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot .stxt{flex:1}
.slot .fix{flex-basis:100%;margin-left:40px}
.gtext{font-size:1.06rem;line-height:2.3;background:var(--bg2);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.gap{display:inline-block;min-width:110px;padding:2px 10px;margin:0 2px;border-radius:8px;border:2px dashed #4b5d8a;background:#0e1730;font-size:1rem;font-weight:700;color:var(--gold);line-height:1.6}
.gap.ready{border-color:var(--gold)}
.gap.filled{border-style:solid}
.gtext .fix{display:inline;margin-left:4px}
.hunt{display:grid;gap:8px}
.hs{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);font-size:.98rem}

.hs-n{width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.hs.flag{border-color:var(--orange);background:rgba(255,138,61,.1)}
.hs.flag .hs-n{background:var(--orange);color:#0b1020}
.hs.fa{opacity:.6;text-decoration:line-through}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.98rem;animation:fadeUp .35s ease}
.fb-ok{background:rgba(34,214,138,.1);border:1px solid rgba(34,214,138,.4)}
.fb-hint{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.45)}
.fb-bad{background:rgba(255,64,96,.09);border:1px solid rgba(255,64,96,.4)}
.fb-info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.4)}
.qact{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.shake{animation:shake .45s ease}

/* ---------- Bilans ---------- */
.medal{font-size:4rem;line-height:1}
.grade{display:inline-block;font-size:1.1rem;font-weight:800;padding:6px 14px;border-radius:999px;margin:8px 0}
.grade.A{background:rgba(34,214,138,.15);color:var(--accent)}
.grade.B{background:rgba(59,130,246,.15);color:var(--actif2)}
.grade.C{background:rgba(255,138,61,.15);color:var(--orange)}
.grade.D{background:rgba(255,64,96,.15);color:#ff8fa3}
.stars{font-size:1.6rem;color:var(--gold);letter-spacing:4px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--text2);margin:12px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
.tbl th{color:var(--text2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.predres{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.35);border-radius:12px;padding:12px 14px;margin:12px 0}
/* fiche imprimable (fond clair) */
.fiche{background:#fbfcfe;color:#1c2333;border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}

.fiche .fhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid #e2e8f0;padding-bottom:10px;margin-bottom:14px}

.fiche .tbl th{color:#64748b}
.fiche .tbl td,.fiche .tbl th{border-bottom:1px solid #e2e8f0}

.fsum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}

.fsum span{font-size:.78rem;color:#64748b}
.crit{border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}

.rev{font-size:.85rem;color:#7c2d12;background:#fff7ed;border-left:3px solid #fb923c;border-radius:6px;padding:6px 10px;margin:2px 0 6px}
.allok{background:#dcfce7;color:#166534;border-radius:10px;padding:10px 12px;font-weight:600;margin-top:8px}
.fiche .noprint{margin-top:14px}

/* ---------- Effets ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:9000;overflow:hidden}
.pt{position:absolute;width:9px;height:9px;border-radius:50%;animation:pt .8s ease-out forwards}

.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:2.4rem;font-weight:900;color:var(--orange);text-shadow:0 0 24px rgba(255,138,61,.7);z-index:9100;pointer-events:none;animation:comboIn 1.3s ease forwards;white-space:nowrap}
.confetti{position:absolute;top:-12px;width:10px;height:14px;animation:fall linear forwards}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:9200;background:linear-gradient(135deg,#2a2152,#1b2747);border:1px solid var(--gold);border-radius:16px;padding:12px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.34,1.56,.64,1);width:max-content;max-width:92vw}
#toast.show{transform:translate(-50%,0)}
#toast .ti{font-size:2rem}
#toast .tt{font-size:.75rem;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#toast .tn{font-weight:800}
.overlay{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.rk-card{position:relative;background:linear-gradient(160deg,#1f2a52,#121a2e);border:2px solid var(--gold);border-radius:22px;padding:30px 26px;text-align:center;max-width:380px;width:100%;animation:slideUp .5s cubic-bezier(.34,1.56,.64,1)}
.rk-rays{position:absolute;inset:-60px;background:repeating-conic-gradient(from 0deg,rgba(251,191,36,.12) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:vSpin 14s linear infinite;z-index:-1}
.rk-ic{font-size:4.5rem}
.rk-t{font-size:.85rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.rk-n{font-size:1.8rem;font-weight:900;margin:4px 0 8px}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%{transform:translateY(-14px)}60%{transform:translateY(3px)}100%{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

<script>
/* =====================================================================
   DONNÉES PÉDAGOGIQUES — cours « Le patrimoine », pages 10 à 14
   (2.1 Du patrimoine personnel au patrimoine d’entreprise · 2.2 L’actif ·
    2.3 Le passif · 2.4 Le bilan)
   ===================================================================== */

const CRITERES = [
  { id:'C1', nom:"Comprendre ce qu’est le patrimoine de l’entreprise", indicateurs:[
    { id:'I1', texte:"Je relie mon patrimoine à celui de l’entreprise : avoirs → actif, dettes → passif",
      chapitre:"Du patrimoine personnel au patrimoine d’entreprise",
      revoir:"le tableau qui fait passer de « ce que je possède / ce que je dois » à « l’actif / le passif »" },
    { id:'I2', texte:"Je calcule le capital de l’entreprise : actif − dettes",
      chapitre:"Du patrimoine personnel au patrimoine d’entreprise",
      revoir:"la formule « capital de l’entreprise = actif − dettes », puis refais un calcul pas à pas" }
  ]},
  { id:'C2', nom:"Classer les éléments du patrimoine de l’entreprise", indicateurs:[
    { id:'I3', texte:"Je distingue les actifs immobilisés (incorporels ou corporels) et les actifs circulants",
      chapitre:"L’actif : ce que l’entreprise possède",
      revoir:"la différence entre « conservé plus d’un an » et « transformé en moins d’un an », puis entre « qu’on peut toucher » et « qu’on ne peut pas toucher »" },
    { id:'I4', texte:"Je distingue les capitaux propres et les capitaux étrangers (les dettes)",
      chapitre:"Le passif : d’où vient l’argent ?",
      revoir:"les deux sources de l’argent : le ou les propriétaires (capitaux propres) et les tiers (capitaux étrangers)" },
    { id:'I5', texte:"Je classe une dette : à un an au plus ou à plus d’un an",
      chapitre:"Le passif : d’où vient l’argent ?",
      revoir:"la frise « aujourd’hui → 12 mois → plus tard » et les exemples de chaque type de dette" }
  ]},
  { id:'C3', nom:"Comprendre le bilan", indicateurs:[
    { id:'I6', texte:"J’explique que le bilan est une photo du patrimoine, toujours en équilibre : total actif = total passif",
      chapitre:"Le bilan : la photographie du patrimoine",
      revoir:"l’encadré « Pourquoi le bilan est-il toujours en équilibre ? » et le dessin de la balance" }
  ]}
];

const LEVELS = [
/* ------------------------------------------------------------------ MISSION 1 */
{ icon:'🔁', title:"Du perso au pro", desc:"Le même principe que ton patrimoine, avec des mots de pro",
  objectifs:["relier ton patrimoine à celui d’une entreprise : avoirs → actif, dettes → passif ;",
             "calculer le capital d’une entreprise : actif − dettes."],
  rappel:`<ul>
    <li>Ce que l’entreprise <b>possède</b> = son <b>actif</b>.</li>
    <li>Ce que l’entreprise <b>doit</b> = le <b>passif</b> (ses <b>dettes</b>).</li>
    <li><b>Capital de l’entreprise = actif − dettes</b> : ce qui lui appartient vraiment.</li>
    <li>Quand quelqu’un doit de l’argent à l’entreprise, c’est une <b>créance</b> : elle la possède, c’est un actif.</li></ul>`,
  exemple:`Comme pour une personne : Sami possède 3 000 € d’avoirs et doit 1 000 € à ses parents. Son capital vaut 3 000 − 1 000 = <b>2 000 €</b>.`,
  plus:`<b>L’astuce du cours pour retenir :</b> <b>P</b>rêt = <b>P</b>osséder (on te doit de l’argent : c’est une créance, un avoir). <b>E</b>mprunt = <b>E</b>ndetté (tu dois de l’argent : c’est une dette).`,
  questions:[
    { type:'qcm', ind:'I1', pts:6,
      q:"La boulangerie de Lina possède un four, une camionnette et 3 000 € sur son compte en banque. Dans le vocabulaire de l’entreprise, tous ces éléments font partie…",
      options:["de l’actif de la boulangerie","du passif de la boulangerie","des dettes de la boulangerie","du capital de la boulangerie"],
      correct:0,
      hint:"Ces éléments, la boulangerie les possède ou les doit ? Dans ton patrimoine, ce que tu possèdes, ce sont tes avoirs… et pour une entreprise ?",
      expl:"Ce que l’entreprise possède forme son <b>actif</b>, comme tes avoirs dans ton patrimoine personnel. Le capital, lui, se calcule : actif − dettes." },
    { type:'match', ind:'I1', pts:8,
      q:"Relie chaque mot à sa définition.",
      items:[ {t:"Le patrimoine", a:0}, {t:"L’actif", a:1}, {t:"Le passif", a:2}, {t:"Le capital de l’entreprise", a:3} ],
      options:["L’ensemble de ce que l’entreprise possède et de ce qu’elle doit","Ce que l’entreprise possède","Ce que l’entreprise doit","Actif − dettes : ce qui appartient vraiment à l’entreprise","Actif + dettes","Uniquement l’argent qui se trouve dans la caisse"],
      hint:"Pense au tableau « patrimoine personnel → patrimoine d’entreprise » : mes avoirs deviennent… ? mes dettes deviennent… ? Et le capital se calcule en retirant les dettes.",
      expl:"Le <b>patrimoine</b> est l’ensemble de ce que l’entreprise possède et de ce qu’elle doit. L’<b>actif</b> = ce qu’elle possède ; le <b>passif</b> = ce qu’elle doit ; le <b>capital</b> = actif − dettes." },
    { type:'input', ind:'I2', pts:8, unit:'€', answer:18000,
      q:"Calcule le <b>capital</b> du food truck de Sami.",
      data:"🍔 Food truck « Chez Sami »<br>Ce que l’entreprise possède : camion-cuisine <b>32 000 €</b> · matériel de cuisson <b>4 500 €</b> · stock de pains et de viande <b>800 €</b> · argent en banque <b>2 700 €</b><br>Ce que l’entreprise doit : emprunt bancaire <b>21 000 €</b> · facture du boucher <b>1 000 €</b>",
      hint:"Additionne d’abord tout ce que l’entreprise possède, puis tout ce qu’elle doit. Ensuite : capital = … − … ?",
      expl:"Actif = 32 000 + 4 500 + 800 + 2 700 = 40 000 €. Dettes = 21 000 + 1 000 = 22 000 €. Capital = 40 000 − 22 000 = <b>18 000 €</b>." },
    { type:'vf', ind:'I2', pts:4,
      q:"Vrai ou faux ?",
      statement:"Une entreprise qui possède beaucoup de choses a forcément un capital élevé.",
      answer:false,
      expl:"<b>Faux.</b> Il faut retirer ses dettes : capital = actif − dettes. Une entreprise qui possède beaucoup mais qui doit presque autant a un petit capital." },
    { type:'multi', ind:'I1', pts:6,

/* Rotation déterministe : la bonne réponse, rédigée en position 0, est déplacée (CONVENTIONS §3.7). */
const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if (q.type !== 'qcm') return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++) { q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  });
})(LEVELS.flatMap(lv => lv.questions));

LEVELS.forEach(lv => { lv.maxPoints = lv.questions.reduce((s, q) => s + q.pts, 0); });

const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n-1; i > 0; i--) { s = (s*9301 + 49297) % 233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function fmt(n){ const r = Math.round(n*100)/100; return r.toLocaleString('fr-BE', {maximumFractionDigits:2}).replace(/ /g,' '); }
function xp(n){ return (Math.round(n*10)/10).toString().replace('.', ','); }
function getQ(l, i){ return LEVELS[l].questions[i]; }
function key(l, i){ return l + '_' + i; }
function st(l, i){
  const k = key(l, i);
  if (!APP.qs[k]) APP.qs[k] = newState(getQ(l, i), l, i);
  return APP.qs[k];
}
function newState(Q, l, i){
  const seed = l*31 + i*7 + 11;
  const s = {tries:0, status:null, earned:0, fb:null, done:false};
  switch (Q.type) {
    case 'qcm':   s.wrong = []; break;
    case 'vf':    s.pick = null; break;
    case 'multi': s.sel = []; s.order = shuffled(Q.items.length, seed); break;
    case 'input': s.val = ''; break;
    case 'sort':  s.place = {}; s.lock = {}; s.cur = null; s.order = shuffled(Q.items.length, seed); break;
    case 'match': s.val = {}; s.lock = {}; s.optOrder = shuffled(Q.options.length, seed); break;
    case 'order': s.slots = Q.steps.map(() => null); s.lock = {}; s.cur = null; s.bank = shuffled(Q.steps.length + Q.distract.length, seed); break;
    case 'gaps':  s.fill = Q.answers.map(() => null); s.lock = {}; s.cur = null; s.bank = shuffled(Q.answers.length + Q.distract.length, seed); break;
    case 'hunt':  s.flag = {}; s.lock = {}; s.fa = 0; s.faSet = {}; break;
  }
  return s;
}
function cur(){ const l = APP.level, i = APP.q; return {l, i, Q:getQ(l, i), s:st(l, i)}; }
function levelStats(l){
  const r = {correct:0, hint:0, shown:0, earned:0, n:LEVELS[l].questions.length};
  LEVELS[l].questions.forEach((q, i) => { const s = APP.qs[key(l, i)]; if (s && s.done) { r[s.status]++; r.earned += s.earned; } });
  return r;
}
function isUnlocked(l){ return l === 0 || APP.done[l-1]; }
function rankIndex(score){ let r = 0; RANKS.forEach((k, i) => { if (score >= k.xp) r = i; }); return r; }
function gradeOf(p){ return p >= .85 ? ['A','Excellent'] : p >= .65 ? ['B','Très bien'] : p >= .45 ? ['C','Satisfaisant'] : ['D','À retravailler']; }
function medalOf(p){ return p >= .9 ? '🏆' : p >= .7 ? '🥇' : p >= .5 ? '🥈' : '🥉'; }
function starsOf(p){ return p >= .85 ? '★★★' : p >= .65 ? '★★☆' : p >= .45 ? '★☆☆' : '☆☆☆'; }
function studentName(){
  if (!APP.email) return '';

/* Mini-calculatrice (CONVENTIONS §6.1) */
function evalExpr(s){
  let e = String(s).replace(/\s| |€/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch (err) { return null; }
}
function parseNum(s){
  const r = evalExpr(s); if (r !== null) return r;
  let t = String(s).replace(/\s| |€/g,'');
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',', '.');
  else if ((t.match(/\./g)||[]).length > 1) t = t.replace(/\./g,'');
  else if (/^\d{1,3}\.\d{3}$/.test(t)) t = t.replace('.', '');   // « 18.000 » = 18 000
  return parseFloat(t);
}
function calcPreview(v){
  const r = evalExpr(v || '');
  if (r === null) return '';
  const shown = String(v).replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\s+/g,' ');
  return '🧮 ' + esc(shown) + ' → = ' + fmt(r);
}

function vpTick(){
  if (!VP.playing) return;
  const V = vpData(VP.l); if (!V || !$('#vpStage')) { vpStop(); return; }
  VP.el += 0.1;
  const sc = V.scenes[VP.i];
  const waitVoice = VP.speaking && (Date.now() - VP.spokeAt) < (sc.dur + 10) * 1000;
  if (VP.el >= sc.dur && !waitVoice) {
    if (VP.i < V.scenes.length - 1) vpShow(VP.i + 1);
    else { VP.playing = false; VP.ended = true; $('#vpCap').textContent = sc.cap + '  ✅ Fin de la vidéo.'; }
  }
  vpPaint();
}
function vpStart(i){
  VP.started = true; VP.playing = true;
  if (!VP.iv) VP.iv = setInterval(vpTick, 100);
  vpShow(i);
}
function vpToggle(){
  if (!vpData(VP.l)) return;
  if (!VP.started || VP.ended) { vpStart(0); return; }
  VP.playing = !VP.playing;
  const svg = vpSvg();
  if (svg) { svg.classList.toggle('paused', !VP.playing); try { VP.playing ? svg.unpauseAnimations() : svg.pauseAnimations(); } catch(e){} }
  try { if (VP.playing) speechSynthesis.resume(); else speechSynthesis.pause(); } catch(e){}
  vpPaint();
}
function vpGo(i){ const V = vpData(VP.l); if (!V) return; vpStart(Math.max(0, Math.min(V.scenes.length - 1, i))); }
function vpVoice(){
  APP.voice = !APP.voice;
  const b = $('#vpVoice'); if (b) { b.classList.toggle('on', APP.voice); b.textContent = APP.voice ? '🗣️ Voix' : '🔈 Voix'; }
  if (!APP.voice) { try { speechSynthesis.cancel(); } catch(e){} VP.speaking = false; }
  else if (VP.playing) { const V = vpData(VP.l); speak(V.scenes[VP.i].cap); }
}
function speak(t){
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/−/g, ' moins ').replace(/€/g, ' euros'));
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /fr[-_]BE/i.test(x.lang)) || vs.find(x => /^fr/i.test(x.lang));
    u.lang = v ? v.lang : 'fr-BE'; if (v) u.voice = v; u.rate = 1;
    VP.speaking = true; VP.spokeAt = Date.now();
    u.onend = u.onerror = () => { VP.speaking = false; };
    speechSynthesis.speak(u);
  } catch(e){ VP.speaking = false; }
}

/* =====================================================================
   QUESTIONS — rendu
   ===================================================================== */
function renderQuestion(l, i){
  const lv = LEVELS[l], Q = getQ(l, i), s = st(l, i), n = lv.questions.length;
  let h = `<div class="qtop"><button class="link" onclick="openBrief(${l})">← Briefing</button><span class="qcount">${lv.icon} Mission ${l+1} · Question ${i+1}/${n}</span></div>`;
  h += `<div class="qdots" aria-hidden="true">${lv.questions.map((q, k) => { const t = APP.qs[key(l, k)]; return `<span class="qdot ${k===i?'now':''} ${t&&t.done?t.status:''}"></span>`; }).join('')}</div>`;
  h += `<div class="card" id="qcard">`;
  h += `<div class="qlabel">${TYPE_LABEL[Q.type]} — ${Q.type==='vf' ? '1 essai' : '2 essais'} · ${Q.pts} XP</div>`;
  h += `<div class="qtext">${Q.q}</div>`;
  if (Q.data) h += `<div class="data">${Q.data}</div>`;
  h += BODY[Q.type](Q, s);
  if (s.fb) h += `<div class="fb fb-${s.fb.kind}">${s.fb.html}</div>`;
  h += `<div class="qact">`;
  if (!s.done && VERIFY[Q.type]) h += `<button class="btn" id="verifyBtn" ${canVerify(Q, s) ? '' : 'disabled'} onclick="VERIFY['${Q.type}'](event)">✔ Vérifier</button>`;
  if (s.done) h += i < n - 1 ? `<button class="btn" onclick="nextQ()">Question suivante ➜</button>` : `<button class="btn gold" onclick="nextQ()">Voir le bilan de la mission ➜</button>`;
  h += `</div></div>`;
  return h;
}
function afterQuestion(){
  const c = $('#qcard'); if (!c) return;
  if (APP.shakeNow) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); APP.shakeNow = false; }
  if (APP.burstAt) { const b = APP.burstAt; APP.burstAt = null; let x = b.x, y = b.y; if (!x && !y) { const r = c.getBoundingClientRect(); x = r.left + r.width/2; y = r.top + 80; } burst(x, y, b.pts); }
  const inp = $('#ans'); if (inp && !inp.disabled && document.activeElement !== inp) inp.focus({preventScroll:true});
}
function canVerify(Q, s){
  switch (Q.type) {
    case 'multi': return s.sel.length > 0;
    case 'input': return String(s.val).trim() !== '';
    case 'sort':  return Q.items.every((it, k) => s.place[k] !== undefined);
    case 'match': return Q.items.every((it, k) => s.val[k] !== undefined);
    case 'order': return s.slots.every(v => v !== null);
    case 'gaps':  return s.fill.every(v => v !== null);
    case 'hunt':  return s.tries > 0 || Object.values(s.flag).some(Boolean);
  }
  return true;
}
const BODY = {
  qcm(Q, s){
    return `<div class="opts">${Q.options.map((o, k) => {
      let c = 'opt';
      if (s.wrong.includes(k)) c += ' wrong';
      if (s.done && k === Q.correct) c += s.status === 'shown' ? ' reveal' : ' right';
      const dis = s.done || s.wrong.includes(k);
      return `<button class="${c}" ${dis?'disabled':''} onclick="qcmPick(event,${k})"><span class="opt-l">${'ABCD'[k]}</span><span>${o}</span></button>`;
    }).join('')}</div>`;
  },
  vf(Q, s){
    return `<div class="vf-st">« ${Q.statement} »</div><div class="vf">${[true, false].map(v => {
      let c = 'vfbtn';
      if (s.done) { if (v === Q.answer) c += ' right'; else if (s.pick === v) c += ' wrong'; }
      return `<button class="${c}" ${s.done?'disabled':''} onclick="vfPick(event,${v})">${v ? '✅ Vrai' : '❌ Faux'}</button>`;
    }).join('')}</div>`;
  },
  multi(Q, s){
    return `<p class="muted" style="font-size:.88rem;margin-bottom:8px">Plusieurs réponses possibles.</p><div class="multi">${s.order.map(k => {
      const it = Q.items[k], on = s.sel.includes(k);
      let c = 'mitem' + (on ? ' on' : '');
      if (s.done && s.status !== 'correct' && s.status !== 'hint') { if (it.ok && on) c += ' right'; else if (!it.ok && on) c += ' wrong'; else if (it.ok && !on) c += ' missed'; }
      if (s.done && (s.status === 'correct' || s.status === 'hint') && on) c += ' right';
      return `<button class="${c}" ${s.done?'disabled':''} aria-pressed="${on}" onclick="multiToggle(${k})"><span class="box">${on?'✓':''}</span><span>${it.t}</span></button>`;
    }).join('')}</div>`;
  },
  input(Q, s){
    return `<div class="inp"><input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="Ta réponse" value="${esc(s.val)}" ${s.done?'disabled':''}
      oninput="inpChange(this.value)" onkeydown="if(event.key==='Enter'&&!this.disabled)VERIFY.input(event)" placeholder="Ta réponse ou ton calcul"><span class="unit">${Q.unit||''}</span></div>
      <div class="calc" id="calc">${calcPreview(s.val)}</div>
      ${s.done ? '' : '<p class="muted" style="font-size:.82rem">Astuce : tu peux taper directement un calcul, par exemple 1200+300-450.</p>'}`;
  },
  sort(Q, s){
    const reserve = s.order.filter(k => s.place[k] === undefined);
    let h = `<div class="reserve"><div class="rs-t">${s.cur !== null ? '👉 Clique maintenant sur la bonne catégorie' : 'Réserve — clique sur une étiquette, puis sur sa catégorie'}</div><div class="chips">`;
    h += reserve.length ? reserve.map(k => `<button class="chip ${s.cur===k?'sel':''} ${s.bounce&&s.bounce.includes(k)?'bounce':''}" onclick="sortPick(${k})">${Q.items[k].t}</button>`).join('') : '<span class="muted" style="font-size:.88rem">Tout est placé.</span>';
    h += `</div></div><div class="zones z${Q.zones.length}">`;
    Q.zones.forEach((z, zi) => {
      h += `<div class="zone zc-${(Q.zc||[])[zi]||'n'+(zi+1)} ${s.cur!==null?'ready':''}" role="button" tabindex="0" aria-label="Placer dans ${esc(z)}" onclick="sortZone(${zi})" onkeydown="if(event.key==='Enter')sortZone(${zi})"><div class="zone-t">${z}</div><div class="chips">`;
      s.order.filter(k => s.place[k] === zi).forEach(k => {
        const lk = s.lock[k];
        if (lk) h += `<button class="chip lock-${lk}" disabled>${Q.items[k].t}${lk==='r' ? `<span class="fix">→ ${Q.zones[Q.items[k].z]}</span>` : ''}</button>`;
        else h += `<button class="chip" onclick="event.stopPropagation();sortUnplace(${k})" title="Retirer">${Q.items[k].t}</button>`;
      });
      h += `</div></div>`;
    });
    return h + `</div>`;
  },
  match(Q, s){
    return `<div class="match">${Q.items.map((it, k) => {
      const lk = s.lock[k];
      return `<div class="mrow ${lk?'lock-'+lk:''}"><div class="mterm">${it.t}</div>
        <select aria-label="Réponse pour ${esc(it.t)}" ${lk?'disabled':''} onchange="matchSet(${k},this.value)"><option value="">— choisis —</option>
        ${s.optOrder.map(oi => `<option value="${oi}" ${s.val[k]===oi?'selected':''}>${Q.options[oi]}</option>`).join('')}</select>
        ${lk==='r' ? `<span class="fix">✏️ Bonne réponse : ${Q.options[it.a]}</span>` : ''}</div>`;
    }).join('')}</div>`;
  },
  order(Q, s){
    const all = Q.steps.concat(Q.distract);
    let h = `<div class="slots">`;
    s.slots.forEach((v, si) => {
      const lk = s.lock[si];
      h += `<div class="slot ${v!==null?'filled':''} ${lk?'lock-'+lk:''} ${s.cur!==null&&!lk?'ready':''}" role="button" tabindex="0" aria-label="Emplacement ${si+1}" onclick="orderSlot(${si})" onkeydown="if(event.key==='Enter')orderSlot(${si})">
        <span class="num">${si+1}</span><span class="stxt">${v===null ? '<span class="muted">Clique une étape, puis ici</span>' : all[v]}</span>${lk==='r' ? `<span class="fix">✏️ ${Q.steps[si]}</span>` : ''}</div>`;
    });
    h += `</div><div class="reserve"><div class="rs-t">${s.cur!==null ? '👉 Clique maintenant sur un emplacement numéroté' : 'Étapes — clique sur une étape, puis sur son emplacement'}</div><div class="chips">`;
    const used = s.slots.filter(v => v !== null);
    h += s.bank.filter(k => !used.includes(k)).map(k => `<button class="chip ${s.cur===k?'sel':''} ${s.bounce&&s.bounce.includes(k)?'bounce':''}" ${s.done?'disabled':''} onclick="orderPick(${k})">${all[k]}</button>`).join('');
    return h + `</div></div>`;
  },
  gaps(Q, s){
    const words = Q.answers.concat(Q.distract);
    const txt = Q.text.replace(/\{(\d+)\}/g, (m, g) => {
      const gi = +g, v = s.fill[gi], lk = s.lock[gi];
      return `<button class="gap ${v!==null?'filled':''} ${lk?'lock-'+lk:''} ${s.cur!==null&&!lk?'ready':''}" ${lk?'disabled':''} aria-label="Trou ${gi+1}" onclick="gapClick(${gi})">${v===null ? '……' : words[v]}</button>${lk==='r' ? `<span class="fix">✏️ ${Q.answers[gi]}</span>` : ''}`;
    });
    const used = s.fill.filter(v => v !== null);
    return `<div class="gtext">${txt}</div><div class="reserve"><div class="rs-t">${s.cur!==null ? '👉 Clique maintenant sur un trou' : 'Banque de mots — clique sur un mot, puis sur le trou'}</div><div class="chips">
      ${s.bank.filter(k => !used.includes(k)).map(k => `<button class="chip ${s.cur===k?'sel':''} ${s.bounce&&s.bounce.includes(k)?'bounce':''}" ${s.done?'disabled':''} onclick="gapPick(${k})">${words[k]}</button>`).join('')}</div></div>`;
  },
  hunt(Q, s){
    return `<div class="hunt">${Q.sentences.map((x, k) => {
      const lk = s.lock[k], on = s.flag[k];
      let c = 'hs' + (on ? ' flag' : '') + (lk ? ' lock-' + lk : '') + (s.faSet[k] && !x.wrong ? ' fa' : '');
      return `<button class="${c}" ${lk||s.done?'disabled':''} aria-pressed="${!!on}" onclick="huntToggle(${k})"><span class="hs-n">${k+1}</span><span>${x.t}${lk ? `<span class="fix">✏️ ${x.fix}</span>` : ''}</span></button>`;
    }).join('')}</div>`;
  }
};

/* =====================================================================
   QUESTIONS — interactions
   ===================================================================== */
function evPos(ev){ return ev && ev.clientX ? {x:ev.clientX, y:ev.clientY} : {x:0, y:0}; }
function miss(){ APP.streak = 0; APP.shakeNow = true; sfx('err'); }

function qcmPick(ev, o){
  const {Q, s} = cur(); if (s.done || s.wrong.includes(o)) return;
  if (o === Q.correct) {
    s.fb = {kind:'ok', html:(s.tries ? '🔄 Correct au 2e essai. ' : '✅ Exact ! ') + Q.expl};
    finishQ(s, s.tries === 0 ? 'correct' : 'hint', s.tries === 0 ? Q.pts : Q.pts / 2, ev);
  } else {
    s.wrong.push(o); s.tries++;
    if (s.tries === 1) { s.fb = {kind:'hint', html:'💡 <b>Indice :</b> ' + Q.hint}; miss(); renderScreen(); }
    else { s.fb = {kind:'bad', html:'👁 La bonne réponse était : <b>' + Q.options[Q.correct] + '</b>.<br>' + Q.expl}; miss(); finishQ(s, 'shown', 0, ev); }
  }
}
function vfPick(ev, v){
  const {Q, s} = cur(); if (s.done) return;
  s.pick = v; s.tries = 1;
  if (v === Q.answer) { s.fb = {kind:'ok', html:'✅ ' + Q.expl}; finishQ(s, 'correct', Q.pts, ev); }
  else { s.fb = {kind:'bad', html:'❌ ' + Q.expl}; miss(); finishQ(s, 'shown', 0, ev); }
}
function multiToggle(k){
  const {s} = cur(); if (s.done) return;
  const p = s.sel.indexOf(k); if (p >= 0) s.sel.splice(p, 1); else s.sel.push(k);
  renderScreen();
}
function inpChange(v){
  const {s, Q} = cur(); s.val = v;
  const c = $('#calc'); if (c) c.innerHTML = calcPreview(v);
  const b = $('#verifyBtn'); if (b) b.disabled = !canVerify(Q, s);
}

const VERIFY = {
  multi(ev){
    const {Q, s} = cur(); if (s.done) return;
    const good = Q.items.map((it, k) => it.ok ? k : -1).filter(k => k >= 0);
    const ok = good.length === s.sel.length && good.every(k => s.sel.includes(k));
    if (ok) { s.fb = {kind:'ok', html:(s.tries ? '🔄 Correct au 2e essai. ' : '✅ Tout juste ! ') + Q.expl}; finishQ(s, s.tries === 0 ? 'correct' : 'hint', s.tries === 0 ? Q.pts : Q.pts / 2, ev); return; }
    s.tries++;
    if (s.tries === 1) { s.fb = {kind:'hint', html:'🔁 Ce n’est pas encore tout à fait ça : modifie ta sélection.<br>💡 <b>Indice :</b> ' + Q.hint}; miss(); renderScreen(); }
    else { s.fb = {kind:'bad', html:'👁 Correction : les bonnes réponses sont en vert, celles oubliées en pointillés, les erreurs en rouge.<br>' + Q.expl}; miss(); finishQ(s, 'shown', 0, ev); }
  },
  input(ev){
    const {Q, s} = cur(); if (s.done) return;
    const v = parseNum(s.val);
    if (isNaN(v)) { s.fb = {kind:'info', html:'✏️ Écris un nombre (ou un calcul), par exemple 12 500.'}; renderScreen(); return; }
    if (Math.abs(v - Q.answer) <= 0.02) {
      s.fb = {kind:'ok', html:(s.tries ? '🔄 Correct au 2e essai. ' : '✅ Exact ! ') + Q.expl};
      finishQ(s, s.tries === 0 ? 'correct' : 'hint', s.tries === 0 ? Q.pts : Q.pts / 2, ev); return;
    }
    s.tries++;
    if (s.tries === 1) { s.fb = {kind:'hint', html:'🔁 Ce n’est pas ' + fmt(v) + ' ' + (Q.unit||'') + '.<br>💡 <b>Indice :</b> ' + Q.hint}; miss(); renderScreen(); }
    else { s.fb = {kind:'bad', html:'👁 La bonne réponse est <b>' + fmt(Q.answer) + ' ' + (Q.unit||'') + '</b>.<br>' + Q.expl}; miss(); finishQ(s, 'shown', 0, ev); }
  },
  sort(ev){
    const {Q, s} = cur(); if (s.done || !canVerify(Q, s)) return;
    s.tries++; s.bounce = [];
    Q.items.forEach((it, k) => {
      if (s.lock[k]) return;
      if (s.place[k] === it.z) s.lock[k] = s.tries === 1 ? 'g' : 'o';
      else if (s.tries === 1) { delete s.place[k]; s.bounce.push(k); }
      else s.lock[k] = 'r';
    });
    s.cur = null;
    afterElemVerify(Q, s, Q.items.length, ev);
  },
  match(ev){
    const {Q, s} = cur(); if (s.done || !canVerify(Q, s)) return;
    s.tries++;
    Q.items.forEach((it, k) => {
      if (s.lock[k]) return;
      if (s.val[k] === it.a) s.lock[k] = s.tries === 1 ? 'g' : 'o';
      else if (s.tries === 1) delete s.val[k];
      else s.lock[k] = 'r';
    });
    afterElemVerify(Q, s, Q.items.length, ev);
  },
  order(ev){
    const {Q, s} = cur(); if (s.done || !canVerify(Q, s)) return;
    s.tries++; s.bounce = [];
    s.slots.forEach((v, si) => {
      if (s.lock[si]) return;
      if (v === si) s.lock[si] = s.tries === 1 ? 'g' : 'o';
      else if (s.tries === 1) { s.bounce.push(v); s.slots[si] = null; }
      else s.lock[si] = 'r';
    });
    s.cur = null;
    afterElemVerify(Q, s, Q.steps.length, ev);
  },
  gaps(ev){
    const {Q, s} = cur(); if (s.done || !canVerify(Q, s)) return;
    s.tries++; s.bounce = [];
    s.fill.forEach((v, gi) => {
      if (s.lock[gi]) return;
      if (v === gi) s.lock[gi] = s.tries === 1 ? 'g' : 'o';
      else if (s.tries === 1) { s.bounce.push(v); s.fill[gi] = null; }
      else s.lock[gi] = 'r';
    });
    s.cur = null;
    afterElemVerify(Q, s, Q.answers.length, ev);
  },
  hunt(ev){
    const {Q, s} = cur(); if (s.done || !canVerify(Q, s)) return;
    s.tries++; let newFa = 0;
    Q.sentences.forEach((x, k) => {
      if (s.lock[k]) return;
      if (x.wrong) { if (s.flag[k]) s.lock[k] = s.tries === 1 ? 'g' : 'o'; else if (s.tries === 2) s.lock[k] = 'r'; }
      else if (s.flag[k]) { newFa++; s.faSet[k] = true; s.flag[k] = false; }
    });
    s.fa += newFa;
    const n = Q.sentences.filter(x => x.wrong).length;
    const found = Object.keys(s.lock).length;
    if (s.tries === 1 && found < n) {
      s.fb = {kind:'hint', html:`🔍 Tu as trouvé <b>${found} erreur${found>1?'s':''} sur ${n}</b>.` + (newFa ? ` ${newFa} fausse${newFa>1?'s':''} alerte${newFa>1?'s':''} (barrée${newFa>1?'s':''}) : −${newFa} XP.` : '') + ` Cherche encore !<br>💡 <b>Indice :</b> ` + Q.hint};
      miss(); renderScreen(); return;
    }
    if (newFa && s.tries === 1) s.fbExtra = ` ${newFa} fausse${newFa>1?'s':''} alerte${newFa>1?'s':''} : −${newFa} XP.`;
    itemFinish(Q, s, n, ev);
  }
};
function afterElemVerify(Q, s, n, ev){
  const vals = Object.values(s.lock);
  const g = vals.filter(v => v === 'g').length;
  if (s.tries === 1 && g < n) {
    s.fb = {kind:'hint', html:`🔁 <b>${g} sur ${n}</b> ${g>1?'sont justes et verrouillés':'est juste et verrouillé'} en vert. Les autres sont revenus dans la réserve : replace-les.<br>💡 <b>Indice :</b> ` + Q.hint};
    miss(); renderScreen(); return;
  }
  itemFinish(Q, s, n, ev);
}
/* Barème par élément + statut (CONVENTIONS §3.8), commun à tous les exercices à éléments */
function itemFinish(Q, s, n, ev){
  const per = Q.pts / n; let e = 0;
  const vals = Object.values(s.lock);
  vals.forEach(v => { e += v === 'g' ? per : v === 'o' ? per / 2 : 0; });
  if (Q.type === 'hunt') e = Math.max(0, e - s.fa);
  e = Math.round(e * 10) / 10;
  const status = vals.length === n && vals.every(v => v === 'g') ? 'correct' : vals.some(v => v === 'r') ? 'shown' : 'hint';
  const extra = s.fbExtra || ''; s.fbExtra = '';
  if (status === 'correct') s.fb = {kind:'ok', html:'✅ Tout est juste du premier coup !' + extra + '<br>' + Q.expl};
  else if (status === 'hint') s.fb = {kind:'ok', html:'🔄 Tout est juste après correction (en orange : corrigé au 2e essai).<br>' + Q.expl};
  else { s.fb = {kind:'bad', html:'👁 Les corrections sont affichées sur les éléments en rouge.<br>' + Q.expl}; miss(); }
  finishQ(s, status, e, ev);
}

/* --- classement (clic-clic) --- */
function sortPick(k){ const {s} = cur(); if (s.done) return; s.cur = s.cur === k ? null : k; s.bounce = []; renderScreen(); }
function sortZone(zi){ const {s} = cur(); if (s.done || s.cur === null) return; s.place[s.cur] = zi; s.cur = null; renderScreen(); }
function sortUnplace(k){ const {s} = cur(); if (s.done || s.lock[k]) return; delete s.place[k]; s.cur = k; s.bounce = []; renderScreen(); }
/* --- appariement --- */
function matchSet(k, v){ const {s} = cur(); if (s.done || s.lock[k]) return; if (v === '') delete s.val[k]; else s.val[k] = +v; renderScreen(); }
/* --- remise en ordre --- */
function orderPick(k){ const {s} = cur(); if (s.done) return; s.cur = s.cur === k ? null : k; s.bounce = []; renderScreen(); }
function orderSlot(si){
  const {s} = cur(); if (s.done || s.lock[si]) return;
  if (s.cur !== null) { s.slots[si] = s.cur; s.cur = null; }
  else if (s.slots[si] !== null) { s.cur = s.slots[si]; s.slots[si] = null; }
  s.bounce = []; renderScreen();
}
/* --- texte à trous --- */

function finishQ(s, status, earned, ev){
  s.done = true; s.status = status; s.earned = earned;
  APP.score += earned;
  if (status === 'correct') {
    APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak);
    sfx('ok'); combo();
    if (APP.streak >= 5) award('s5');
    if (APP.streak >= 10) award('s10');
  } else { APP.streak = 0; if (status === 'hint') sfx('ok'); }
  const Q = getQ(APP.level, APP.q);
  if (status === 'correct' && Q.type === 'sort') award('sort');
  if (status === 'correct' && Q.type === 'hunt' && s.fa === 0) award('hunt');
  if (earned > 0) { const p = evPos(ev); APP.burstAt = {x:p.x, y:p.y, pts:earned}; }
  checkRank();
  const l = APP.level;
  if (LEVELS[l].questions.every((q, i) => st(l, i).done)) completeLevel(l);
  renderScreen();
}
function predCat(c, n){ const r = c / n; return r >= 1 ? 'all' : r >= .625 ? 'tq' : r >= .3 ? 'half' : 'low'; }
function completeLevel(l){
  if (APP.done[l]) return;
  APP.done[l] = true;
  const r = levelStats(l);
  /* tracking : anti-doublon + chronomètre + envoi (SPEC §15.6) */
  if (!APP.completedExercises.includes(l)) {
    APP.completedExercises.push(l);
    const res = stopExerciseTimer(l);
    if (res) sendResult('Mission ' + (l+1) + ' — ' + LEVELS[l].title, Math.round(r.earned * 10) / 10, LEVELS[l].maxPoints, res.temps);
    APP.timerLevel = null;
  }
  sfx('level');
  if (l === 0) award('m1');
  if (r.correct === r.n) award('perfect');
  if (APP.pred[l] && APP.pred[l] === predCat(r.correct, r.n)) award('pred');
  if (APP.done.every(Boolean)) award('all');
}

const FXQ = []; let fxBusy = false;

/* --- sons Web Audio, coupés par défaut (CONVENTIONS §4.10) --- */
let AC = null;
function tone(freq, start, dur, type, vol){
  if (!APP.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + start, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  } catch(e){}
}
function sfx(k){
  if (k === 'ok') { tone(660, 0, .12); tone(990, .1, .18); }
  else if (k === 'err') tone(200, 0, .2, 'triangle', .06);
  else if (k === 'badge') { tone(784, 0, .12); tone(988, .1, .12); tone(1319, .2, .25); }
  else if (k === 'level') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .22));
}

/* =====================================================================
   BILAN FINAL — par critères et indicateurs (CONVENTIONS §4.11)
   ===================================================================== */
function bilanIndicateurs(){
  const acc = {};
  LEVELS.forEach((lv, l) => lv.questions.forEach((q, i) => {
    const a = acc[q.ind] || (acc[q.ind] = {pts:0, max:0});
    a.max += q.pts;
    a.pts += (APP.qs[l + '_' + i] && APP.qs[l + '_' + i].earned) || 0;
  }));
  const statut = r => r >= 0.8 ? 'atteint' : r >= 0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || {pts:0, max:0}; const r = a.max ? a.pts / a.max : 0; return Object.assign({}, ind, {ratio:r, statut:statut(r)}); });
    const tot = c.indicateurs.reduce((t, ind) => { const a = acc[ind.id] || {pts:0, max:0}; return {pts:t.pts + a.pts, max:t.max + a.max}; }, {pts:0, max:0});
    const r = tot.max ? tot.pts / tot.max : 0;
    return {id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds};
  });
}

  if (tab === 'app') url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement('script');
  s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML = '<div style="text-align:center;padding:40px;color:#ff4060;">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab){
  const content = document.getElementById('lbContent');
  const myEmail = (APP.email || '').toLowerCase();
  if (tab === 'global' && data.length > 0) {
    data = data.slice().sort((a, b) => { const pa = a.pct != null ? a.pct : (a.pourcentage || 0), pb = b.pct != null ? b.pct : (b.pourcentage || 0); if (pb !== pa) return pb - pa; return (a.totalTemps || a.totalTime || 0) - (b.totalTemps || b.totalTime || 0); });
    data.forEach((entry, i) => { entry.rang = i + 1; });
  }
  const me = data.find(r => r.email === myEmail);
  let html = '';
  if (me) {
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === 'app' ? 'niveaux' : 'apps';
    const prog = total > 0 ? count + '/' + total + ' ' + label : count + ' ' + label;
    html += `<div style="background:rgba(34,214,138,0.08);border:1px solid rgba(34,214,138,0.3);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:8px;">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent,#22d68a);">#${me.rang}</div><div style="font-size:0.7rem;color:var(--text2,#999);">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;">${me.totalPoints}</div><div style="font-size:0.7rem;color:var(--text2,#999);">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct>=80?'#22d68a':pct>=50?'#ff8a3d':'#ff4060'};">${pct}%</div><div style="font-size:0.7rem;color:var(--text2,#999);">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2,#999);">${prog}</div><div style="font-size:0.7rem;color:var(--text2,#999);">PROGRESSION</div></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;"><tr style="border-bottom:1px solid var(--border,#333);"><th style="text-align:left;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">Élève</th><th style="text-align:right;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2,#999);font-size:0.72rem;">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0;
    const name = String(row.email || '').split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0;
    const isMe = row.email === myEmail;
    const pctC = pct >= 80 ? '#22d68a' : pct >= 50 ? '#ff8a3d' : '#ff4060';
    let tStr = '—'; if (temps > 0) { const m = Math.floor(temps/60), s = temps % 60; tStr = m > 0 ? m + 'm' + String(s).padStart(2,'0') + 's' : s + 's'; }
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);background:${isMe?'rgba(34,214,138,0.08)':'transparent'};"><td style="padding:8px 4px;font-weight:700;">${r<=3&&r>0?medals[r-1]:r}</td><td style="padding:8px 4px;${isMe?'font-weight:800;color:var(--accent,#22d68a);':''}">${esc(name)}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent,#22d68a);">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC};">${pct}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2,#999);font-family:monospace;font-size:0.78rem;">${tStr}</td></tr>`;
  });
  html += '</table>';
  content.innerHTML = html;
}

   DÉMARRAGE
   ===================================================================== */
function init(){
  renderScreen();
  showEmailModal();   // toujours, même si un email est mémorisé (SPEC §7.4)
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#rankup').classList.contains('show')) closeRankup(); else if (document.getElementById('lbOverlay').style.display === 'block') closeLB(); } });
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch(e){} }
init();
</script>
